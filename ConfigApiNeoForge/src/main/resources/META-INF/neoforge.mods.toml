modLoader="javafml"
loaderVersion="${neoforgeLoaderVersionRange}"
issueTrackerURL="${githubUrl}/issues?q=is%3Aissue"
license="The MIT License (MIT)"

[[mods]]
modId="${configApiModId}"
version="${version}"
displayName="Mezz Config API"
displayURL="${githubUrl}"
displayTest="IGNORE_SERVER_VERSION"
authors="${modAuthor}"
description='''
Shared config API for Minecraft mods.
'''

[[dependencies.${configApiModId}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforgeVersionRange}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${configApiModId}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraftVersionRange}"
    ordering="NONE"
    side="BOTH"
