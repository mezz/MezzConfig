name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate build, API, documentation, and publications
        run: ./gradlew --stacktrace spotlessCheck build :CommonApi:javadoc :CommonApi:checkJarCompatibility validatePublishing

      - name: Run NeoForge server GameTests
        run: ./gradlew --stacktrace :NeoForge:runGameTestServer

      - name: Run Fabric and Forge loader smoke tests
        run: ./gradlew --stacktrace --no-configuration-cache :Fabric:runServerSmokeTest :Forge:runServerSmokeTest
