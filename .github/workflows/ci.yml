name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-filesystems:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Common compiles for Java 17 on this target; JUnit requires Java 21 to run.
      - name: Test Common on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat "-PminecraftVersion=1.19.2" --configure-on-demand --stacktrace :Common:test

      - name: Test Common on Unix
        if: runner.os != 'Windows'
        run: ./gradlew -PminecraftVersion=1.19.2 --configure-on-demand --stacktrace :Common:test

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.19.2
            java: 21
            modloaders: [fabric, forge]
          - minecraft: 1.20.1
            java: 21
            modloaders: [fabric, forge]
          - minecraft: 1.21.1
            java: 21
            modloaders: [fabric, forge, neoforge]
          - minecraft: 1.21.11
            java: 21
            modloaders: [fabric, neoforge]
          - minecraft: 26.1.2
            java: 25
            modloaders: [fabric, neoforge]
          - minecraft: '26.2'
            java: 25
            modloaders: [fabric, neoforge]
          - minecraft: '26.3'
            java: 25
            modloaders: [fabric, neoforge]

    steps:
      - uses: actions/checkout@v7

      - name: Install compile and test toolchains
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate build, API, documentation, and publications
        run: ./gradlew -PminecraftVersion=${{ matrix.minecraft }} --stacktrace spotlessCheck build :Common:apiJavadoc :Common:checkJarCompatibility validateDocumentationLinks validateFabricEmbedding validatePublishedApiConsumers

      - name: Run Fabric loader smoke test
        if: contains(matrix.modloaders, 'fabric')
        run: ./gradlew -PminecraftVersion=${{ matrix.minecraft }} --stacktrace --no-configuration-cache :Fabric:runServerSmokeTest

      - name: Run Forge loader smoke test
        if: contains(matrix.modloaders, 'forge')
        run: ./gradlew -PminecraftVersion=${{ matrix.minecraft }} --stacktrace --no-configuration-cache validateForgeEmbedding :Forge:runServerSmokeTest

      - name: Run NeoForge GameTests and consumer embedding
        if: contains(matrix.modloaders, 'neoforge')
        run: ./gradlew -PminecraftVersion=${{ matrix.minecraft }} --stacktrace --no-configuration-cache :NeoForge:runGameTestServer :NeoForge:runStandaloneServerSmokeTest validateNeoForgeEmbedding

      - name: Check release metadata without publishing
        run: ./gradlew -PminecraftVersion=${{ matrix.minecraft }} --stacktrace publishMods -PpublishDryRun=true
