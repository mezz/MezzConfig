modLoader="javafml"
loaderVersion="${neoforgeLoaderVersionRange}"
issueTrackerURL="${githubUrl}/issues?q=is%3Aissue"
license="The MIT License (MIT)"

[[mods]]
modId="${neoforgeTestModId}"
version="${version}"
displayName="MezzConfig NeoForge Test"
displayURL="${githubUrl}"
displayTest="IGNORE_SERVER_VERSION"
authors="${modAuthor}"
description='''
In-game test config registrations for MezzConfig on NeoForge.
'''

[[dependencies.${neoforgeTestModId}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforgeVersionRange}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${neoforgeTestModId}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraftVersionRange}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${neoforgeTestModId}]]
    modId="${configModId}"
    type="required"
    versionRange="[0,)"
    # Intentionally load first to verify physical-side detection does not depend on MezzConfig's constructor.
    ordering="BEFORE"
    side="BOTH"
