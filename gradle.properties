# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.caching=true
# Default IDE import cache. The wrapper selects a cache for each explicit target.
org.gradle.projectcachedir=.gradle/targets/1.21.1
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Build plugins
moddevVersion=2.0.147
publishPluginVersion=2.2.0

# MezzConfig
modName=MezzConfig
modId=mezz_config
configModId=mezz_config
fabricTestModId=mezz_config_test_fabric
forgeTestModId=mezz_config_test_forge
neoforgeTestModId=mezz_config_test_neoforge
configModGroup=net.mezzdev.config
modAuthor=mezz
# http://maven.apache.org/guides/mini/guide-naming-conventions.html
modGroup=net.mezzdev.config
modDescription=A lightweight client and server-authoritative configuration API and runtime for Minecraft mods.
githubUrl=https://github.com/mezz/MezzConfig

# Publishing
curseHomepageUrl=https://www.curseforge.com/minecraft/mc-mods/mezzconfig
curseProjectId=1689768
modrinthId=7tEfOcA7

# Default Minecraft target. Dependency and toolchain pins live in versions/.
# Pass -PminecraftVersion=<version> to select another target.
minecraftVersion=1.21.1

# Test
jUnitVersion=6.1.3

# Dependencies
deduplicatingRunnerVersion=0.1.0
fileWatcherVersion=0.4.0
jetbrainsAnnotationsVersion=26.1.0
# Newer Minecraft/NeoForge dependency metadata strictly pins this annotation API.
jspecifyVersion=1.0.0
jsr305Version=3.0.2
log4jVersion=2.17.0

# Version
specificationVersion=0.5.9
# Keep this at the oldest API artifact version that must remain compatible. When intentionally breaking compatibility,
# bump specificationVersion's minor version and set this to the start of the new compatibility line.
apiBaselineVersion=0.5.2
